name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: uses/actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher-and-addons:
    name: Build Launcher and All Addons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Launcher and Addons
        run: |
          ./gradlew --no-daemon \
            :launcher:app:assembleRelease \
            :addons:brightness:assembleRelease \
            :addons:capacity-stats:assembleRelease \
            :addons:frigate-glance:assembleRelease \
            :addons:headphones:assembleRelease \
            :addons:photo-prints:assembleRelease \
            :addons:photo-screensaver:assembleRelease \
            :addons:prayer-times:assembleRelease \
            :addons:sleep-timer:assembleRelease \
            :addons:tv-hub:assembleRelease \
            :addons:tv-static:assembleRelease \
            :addons:weather:assembleRelease || ./gradlew --no-daemon assembleRelease

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: launcher/app/build/outputs/apk/release/*.apk

      - name: Upload All Addons APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-addons-apks
          path: addons/*/build/outputs/apk/release/*.apk
